name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run regression and safety tests (memory + PostgreSQL via PGlite)
        run: npm test

      - name: Deep safety verification (fuzz, exhaustive depth 3, mutation testing)
        run: npm run safety:verify

      - name: Audit production dependencies
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Validate Cloudflare Worker bundle
        run: npm run cf:check
